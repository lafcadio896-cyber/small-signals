name: Apply social feed v3

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-v3.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Apply payload
        run: |
          cat scripts/v3-payload-*.txt | base64 --decode > /tmp/v3.tar.gz
          tar -xzf /tmp/v3.tar.gz
          rm scripts/v3-payload-*.txt
          rm .github/workflows/apply-v3.yml
          node --check app.js
          python -m py_compile scripts/generate.py
      - name: Commit
        run: |
          git config user.name "small-signals[bot]"
          git config user.email "small-signals[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add social threads and interactions"
          git pull --rebase origin main
          git push origin main
