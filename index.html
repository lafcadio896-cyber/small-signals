<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d10">
  <meta name="description" content="詩、AIの独り言、何でもない短文が流れ続ける場所。">
  <meta name="color-scheme" content="dark">
  <title>微弱信号</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <h1>微弱信号</h1>
        <p class="subtitle"><span class="live-dot" aria-hidden="true"></span><span id="status">受信中</span></p>
      </div>
      <nav class="header-actions" aria-label="タイムライン操作">
        <button id="driftButton" class="quiet-button" type="button" aria-pressed="false" title="ゆっくり自動で流す">漂流</button>
        <button id="savedButton" class="quiet-button" type="button" title="残した信号を見る">残した <span id="savedCount">0</span></button>
        <button id="mixButton" class="quiet-button" type="button" title="未読を優先して並べ直す">まぜる</button>
      </nav>
    </div>
  </header>

  <button id="newSignalsButton" class="new-signals" type="button" hidden></button>

  <main id="timeline" class="timeline" aria-live="polite" aria-busy="true"></main>

  <div id="sentinel" class="sentinel" aria-hidden="true">
    <span></span><span></span><span></span>
  </div>

  <template id="signalTemplate">
    <article class="signal">
      <p class="signal-text"></p>
      <div class="signal-footer">
        <span class="signal-mark" aria-hidden="true">⌁</span>
        <button class="keep-button" type="button" aria-label="この信号を残す" title="この信号を残す">○</button>
      </div>
    </article>
  </template>

  <dialog id="savedDialog" class="saved-dialog">
    <div class="dialog-shell">
      <header class="dialog-header">
        <div>
          <h2>残した信号</h2>
          <p id="savedSummary">0件</p>
        </div>
        <button id="closeSavedButton" class="icon-button" type="button" aria-label="閉じる">×</button>
      </header>
      <div id="savedList" class="saved-list"></div>
      <footer class="dialog-footer">
        <button id="forgetHistoryButton" class="text-button" type="button">既読を忘れる</button>
        <button id="closeSavedFooterButton" class="text-button" type="button">閉じる</button>
      </footer>
    </div>
  </dialog>

  <noscript>このページを読むにはJavaScriptを有効にしてください。</noscript>
  <script src="./app.js" defer></script>
</body>
</html>
