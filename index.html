<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0d10">
  <meta name="description" content="詩、AIの独り言、何でもない短文が流れ続ける場所。">
  <title>微弱信号</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div>
        <h1>微弱信号</h1>
        <p class="subtitle"><span class="live-dot" aria-hidden="true"></span><span id="status">受信中</span></p>
      </div>
      <button id="resetButton" class="quiet-button" type="button" title="既読履歴を消して並べ直す">まぜる</button>
    </div>
  </header>

  <main id="timeline" class="timeline" aria-live="polite" aria-busy="true"></main>

  <div id="sentinel" class="sentinel" aria-hidden="true">
    <span></span><span></span><span></span>
  </div>

  <template id="signalTemplate">
    <article class="signal">
      <p class="signal-text"></p>
      <div class="signal-footer">
        <span class="signal-mark" aria-hidden="true">⌁</span>
        <button class="keep-button" type="button" aria-label="この信号を残す" title="この信号を残す">○</button>
      </div>
    </article>
  </template>

  <noscript>このページを読むにはJavaScriptを有効にしてください。</noscript>
  <script src="./app.js" defer></script>
</body>
</html>
