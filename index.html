<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="短文と小さな会話が流れ続ける架空SNS。">
  <title>微弱信号</title>
  <link rel="stylesheet" href="./styles.css?v=10">
</head>
<body>
  <div class="app-shell">
    <aside class="left-rail" aria-label="メインナビゲーション">
      <div class="left-sticky">
        <button class="brand-button" type="button" data-route="home" aria-label="ホーム">⌁</button>
        <nav class="main-nav">
          <button class="nav-item is-active" type="button" data-route="home"><span>⌂</span><b>ホーム</b></button>
          <button class="nav-item" type="button" data-route="explore"><span>⌕</span><b>話題を検索</b></button>
          <button class="nav-item" type="button" data-route="notifications"><span>◌</span><b>通知</b><i id="notificationBadge" hidden></i></button>
          <button class="nav-item" type="button" data-route="bookmarks"><span>◇</span><b>保存済み</b></button>
          <button class="nav-item" type="button" data-route="profile/you"><span>○</span><b>プロフィール</b></button>
        </nav>
        <button id="openComposer" class="compose-main" type="button">ポストする</button>
        <button class="mini-profile" type="button" data-route="profile/you">
          <span class="avatar tone-0">◌</span>
          <span><strong>あなた</strong><small>@you</small></span>
          <b>•••</b>
        </button>
      </div>
    </aside>

    <main class="center-column">
      <header class="view-header">
        <div class="title-row">
          <button id="backButton" class="icon-button" type="button" aria-label="戻る" hidden>←</button>
          <div><h1 id="viewTitle">ホーム</h1><p id="viewSubtitle" hidden></p></div>
          <button class="icon-button" type="button" aria-label="その他">•••</button>
        </div>
        <div id="feedTabs" class="feed-tabs">
          <button class="feed-tab is-active" data-feed="for-you" type="button">おすすめ</button>
          <button class="feed-tab" data-feed="following" type="button">フォロー中</button>
        </div>
      </header>

      <section id="inlineComposer" class="inline-composer">
        <span class="avatar tone-0">◌</span>
        <div>
          <textarea id="inlineText" maxlength="180" rows="2" placeholder="いまどうしてる？"></textarea>
          <div class="composer-footer">
            <small>この端末だけに保存されます</small>
            <button id="inlineSubmit" class="primary-small" type="button" disabled>ポストする</button>
          </div>
        </div>
      </section>

      <section id="viewContent" aria-live="polite" aria-busy="true">
        <div class="empty"><p>受信しています…</p></div>
      </section>
      <div id="sentinel" class="sentinel" aria-hidden="true"><span></span><span></span><span></span></div>
    </main>

    <aside class="right-rail">
      <div class="right-sticky">
        <label class="search-box"><span>⌕</span><input id="sideSearch" type="search" placeholder="検索"></label>
        <section class="side-card">
          <h2>いま流れているもの</h2>
          <div id="topicList"><p class="side-loading">話題を受信中…</p></div>
        </section>
        <section class="side-card">
          <h2>おすすめの受信元</h2>
          <div id="suggestedAuthors"></div>
        </section>
        <footer class="side-footer">微弱信号 · 自動生成</footer>
      </div>
    </aside>
  </div>

  <nav class="mobile-nav" aria-label="モバイルナビゲーション">
    <button type="button" data-route="home" aria-label="ホーム">⌂</button>
    <button type="button" data-route="explore" aria-label="検索">⌕</button>
    <button type="button" data-route="notifications" aria-label="通知">◌</button>
    <button type="button" data-route="bookmarks" aria-label="保存済み">◇</button>
    <button type="button" data-route="profile/you" aria-label="プロフィール">○</button>
  </nav>
  <button id="mobileComposer" class="mobile-compose" type="button" aria-label="ポストする">＋</button>

  <dialog id="composerDialog" class="composer-dialog">
    <div class="dialog-head">
      <button id="closeComposer" type="button">キャンセル</button>
      <strong id="dialogTitle">ポストする</strong>
      <button id="dialogSubmit" class="primary-small" type="button" disabled>送信</button>
    </div>
    <div id="replyPreview" class="reply-preview" hidden></div>
    <div class="dialog-body">
      <span class="avatar tone-0">◌</span>
      <textarea id="dialogText" maxlength="180" rows="7" placeholder="いまどうしてる？"></textarea>
    </div>
    <div class="dialog-count"><span id="dialogCount">0</span>/180</div>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>
  <script src="./app.js?v=10" defer></script>
</body>
</html>
